
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN PAGE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <h2 class="Login-text">Login with me</h2>
        
        
        <div class="icon-container">
            <div class="google">
                <a href="https://www.google.com/search?" class="icon">
                    <img src="./icons/icons8-google-48.png" alt="Google-icon" width="20px" height="20px">
                    <span>Google</span>
                </a>
            </div>
            <div class="Apple">
                <a href="http://127.0.0.1:5500/index.html" class="icon" id="">
                    <img src="./icons/icons8-apple-48.png" alt="Apple-icon" width="20px" height="20px">
                    <span>Apple</span>
                </a>
            </div>
        </div>

        <p class="seperator"><span class="span">or</span></p>
        
        <form action="home"> 
            <input class="input" type="email" placeholder="Email address" required>
            <input class="input" type="password" placeholder="Password" required>
            <h4 class="forgot-text">Forgot Password?</h4>
            <button type="submit" class="submit-btn">Log in</button>
            <h6>Don't have an account? <a href="">Signup now</a></h6>
        </form>
    </main>
</body>
</html>
